<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>MultiPoke Autocaptura</title>
    <style>
      body { font: 16px system-ui, sans-serif; min-width: 280px; margin: 16px; }
      #status { max-width: 460px; }
      #controles button { display: block; width: 100%; margin-top: 8px; padding: 7px 10px; font: inherit; }
    </style>
    <script src="ativar.js" defer></script>
  </head>
  <body>
    <p id="status" role="status">Procurando a aba do MultiPoke Idle…</p>
    <div id="controles" hidden>
      <button id="alternar-painel" type="button" disabled>Mostrar painel</button>
      <button id="ativar-captura" type="button">Ligar Autocaptura</button>
    </div>
  </body>
</html>
