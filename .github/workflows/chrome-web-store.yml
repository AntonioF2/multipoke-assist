name: Chrome Web Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extension:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
      CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar e empacotar
        run: |
          node --check autocaptura.js
          node --check analise-hunts.js
          node --check loja.js
          node --check ativar.js
          node --check barra.js
          python3 scripts/chrome_web_store.py package multipoke-autocaptura.zip

      - name: Disponibilizar o ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: multipoke-autocaptura.zip
          archive: false
          if-no-files-found: error

      - name: Verificar configuração da loja
        id: config
        run: |
          if [[ -n "$CWS_PUBLISHER_ID" && -n "$CWS_EXTENSION_ID" && -n "$CWS_WORKLOAD_IDENTITY_PROVIDER" && -n "$CWS_SERVICE_ACCOUNT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "ZIP disponível. Configure as quatro variáveis CWS para enviar versões à loja."
          fi

      - name: Autenticar no Google
        id: auth
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Enviar versão nova para revisão
        if: steps.config.outputs.enabled == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/chrome_web_store.py publish multipoke-autocaptura.zip
